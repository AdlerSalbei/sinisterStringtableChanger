name: Build and Package Sinister Inc. Stringtable Changer

on:
  push:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Restore Google Service Account File
      run: |
        echo "${{ secrets.GOOGLE_SERVICE_JSON }}" > service_account.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile main.py --name "SinisterInc_StringtableChanger"

    - name: Install Inno Setup
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile inno_installer.exe
        Start-Process .\inno_installer.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART -Wait
        $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"

    - name: Create Inno Setup script
      run: |
        echo [Setup] > installer.iss
        echo AppName=Sinister Inc. Stringtable Changer >> installer.iss
        echo AppVersion=1.0.0 >> installer.iss
        echo DefaultDirName={pf}\SinisterInc_StringtableChanger >> installer.iss
        echo DisableDirPage=no >> installer.iss
        echo OutputDir=dist >> installer.iss
        echo OutputBaseFilename=SinisterInc_StringtableChanger_Installer >> installer.iss
        echo [Files] >> installer.iss
        echo Source: "dist\SinisterInc_StringtableChanger.exe"; DestDir: "{app}"; Flags: ignoreversion >> installer.iss
        echo Source: "stringtables\*"; DestDir: "{app}\stringtables"; Flags: ignoreversion recursesubdirs >> installer.iss
        echo [Icons] >> installer.iss
        echo Name: "{group}\SinisterInc_StringtableChanger"; Filename: "{app}\SinisterInc_StringtableChanger.exe" >> installer.iss
        echo Name: "{commondesktop}\SinisterInc_StringtableChanger"; Filename: "{app}\SinisterInc_StringtableChanger.exe" >> installer.iss

    - name: Build Installer with Inno Setup
      run: iscc installer.iss

    - name: Prepare ZIP package
      run: |
        mkdir package
        copy dist\SinisterInc_StringtableChanger.exe package\
        xcopy stringtables package\stringtables\ /E /I /Y
        powershell Compress-Archive -Path package\* -DestinationPath SinisterInc_StringtableChanger.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SinisterInc_StringtableChanger
        path: |
          dist/SinisterInc_StringtableChanger.exe
          dist/SinisterInc_StringtableChanger_Installer.exe
          SinisterInc_StringtableChanger.zip

  release:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: SinisterInc_StringtableChanger
        path: dist

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/SinisterInc_StringtableChanger.exe
          dist/SinisterInc_StringtableChanger_Installer.exe
          dist/SinisterInc_StringtableChanger.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
